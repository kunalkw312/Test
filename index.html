<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optenix Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
        }
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); /* slate-800 */
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(71, 85, 105, 0.4); /* slate-600 */
        }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-8">

    <header class="w-full max-w-7xl flex justify-between items-center py-5 mb-8 border-b border-slate-800">
        <div class="flex items-center gap-4">
            <img src="https://res.cloudinary.com/dowhvdkjh/image/upload/v1782474012/OptenixWhite-rPCfLtKB_gehbfb.png" alt="Optenix Logo" class="h-10 object-contain">
            <div class="h-6 w-px bg-slate-700"></div>
            <h1 class="text-xl font-semibold text-slate-200 tracking-wide">Admin Portal</h1>
        </div>
        <div class="flex items-center gap-3">
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="text-sm font-medium text-slate-400">System Online</span>
        </div>
    </header>

    <main class="w-full max-w-7xl flex-1 relative space-y-8">
        
        <!-- Toast Notification Container -->
        <div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col gap-3"></div>

        <section class="glass-panel p-8 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-6 shadow-2xl">
            <div class="flex flex-col gap-2">
                <p class="text-slate-400 text-sm font-medium uppercase tracking-wider">Today's Assessment Access Code</p>
                <div class="flex items-center gap-4">
                    <span id="current-access-code" class="text-5xl font-mono font-bold text-indigo-400 tracking-[0.2em] drop-shadow-md">--------</span>
                </div>
                <p class="text-xs text-slate-500 mt-1">Students need this 8-digit alphanumeric code to begin their test.</p>
            </div>
            <button onclick="generateNewCode()" class="py-4 px-8 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold shadow-[0_0_20px_rgba(79,70,229,0.3)] transition-all hover:-translate-y-0.5 active:translate-y-0 whitespace-nowrap">
                Generate New Code
            </button>
        </section>

        <section class="glass-panel rounded-2xl overflow-hidden shadow-2xl flex flex-col">
            <div class="p-6 bg-slate-800/50 border-b border-slate-700/50 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <h3 class="font-bold text-xl text-slate-100">Live Submissions</h3>
                    <span id="submission-count" class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 py-1 px-3 rounded-full text-xs font-bold">0 Results</span>
                </div>
            </div>
            <div class="overflow-x-auto custom-scrollbar flex-1">
                <table class="w-full text-left text-sm text-slate-300 whitespace-nowrap">
                    <thead class="text-xs text-slate-400 uppercase bg-slate-900/50 tracking-wider">
                        <tr>
                            <th scope="col" class="px-6 py-4 font-semibold">Student Name</th>
                            <th scope="col" class="px-6 py-4 font-semibold">Email</th>
                            <th scope="col" class="px-6 py-4 font-semibold">Score</th>
                            <th scope="col" class="px-6 py-4 font-semibold">Time Taken</th>
                            <th scope="col" class="px-6 py-4 font-semibold">Fullscreen Violated</th>
                            <th scope="col" class="px-6 py-4 font-semibold text-right">Submitted At</th>
                        </tr>
                    </thead>
                    <tbody id="submissions-table-body" class="divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="6" class="px-6 py-12 text-center text-slate-500">
                                <div class="flex flex-col items-center justify-center gap-3">
                                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-500"></div>
                                    <p>Connecting to Realtime Database...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // Firebase Configuration (Provided by User)
        const firebaseConfig = {
            apiKey: "AIzaSyACgdPSGH7jgcW2DvNofv6C_7wGWQGcNrg",
            authDomain: "test-4ea0e.firebaseapp.com",
            databaseURL: "https://test-4ea0e-default-rtdb.firebaseio.com",
            projectId: "test-4ea0e",
            storageBucket: "test-4ea0e.firebasestorage.app",
            messagingSenderId: "640924162744",
            appId: "1:640924162744:web:a4404af2ab63ac203bb24d"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Custom Toast Notification System
        const showToast = (message, isError = false) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            toast.className = `p-4 rounded-xl shadow-2xl text-sm font-medium text-white transform transition-all duration-300 translate-x-full flex items-center gap-3 ${
                isError ? 'bg-red-500/90 border border-red-400' : 'bg-emerald-500/90 border border-emerald-400'
            }`;
            
            const icon = isError 
                ? `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
                : `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;

            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            
            // Slide in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-full');
            });

            // Slide out and remove
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        // Escaper for HTML to prevent XSS in table rendering
        const escapeHTML = str => {
            if (str === null || str === undefined) return "";
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(String(str)));
            return div.innerHTML;
        };

        async function initDashboard() {
            try {
                // Authenticate anonymously to ensure database rules allow read/write
                await signInAnonymously(auth);
                
                // 1. Listen to Access Code node
                const codeRef = ref(db, 'accessCode');
                onValue(codeRef, (snapshot) => {
                    const data = snapshot.val();
                    const codeDisplay = document.getElementById('current-access-code');
                    if (data && data.code) {
                        codeDisplay.innerText = data.code;
                    } else {
                        codeDisplay.innerText = "NOT-SET-";
                    }
                }, (error) => {
                    console.error("Error reading code:", error);
                    showToast("Failed to read access code from database.", true);
                });

                // 2. Listen to Submissions node
                const submissionsRef = ref(db, 'submissions');
                onValue(submissionsRef, (snapshot) => {
                    const tbody = document.getElementById('submissions-table-body');
                    const countSpan = document.getElementById('submission-count');
                    
                    if (!snapshot.exists()) {
                        tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-slate-500">No submissions found.</td></tr>';
                        countSpan.innerText = "0 Results";
                        return;
                    }

                    const data = snapshot.val();
                    // Convert object to array and sort by timestamp descending
                    const submissionsArray = Object.keys(data).map(key => ({
                        id: key,
                        ...data[key]
                    })).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                    countSpan.innerText = `${submissionsArray.length} Results`;

                    tbody.innerHTML = submissionsArray.map(sub => {
                        const dateStr = sub.timestamp ? new Date(sub.timestamp).toLocaleString() : 'N/A';
                        
                        // Parse score safely (assuming format "10/13" or just a number)
                        let scoreValue = String(sub.score || '0');
                        let isGoodScore = false;
                        if (scoreValue.includes('/')) {
                            const [earned, total] = scoreValue.split('/').map(Number);
                            isGoodScore = (earned / total) >= 0.7; // 70% is good
                        } else {
                            isGoodScore = Number(scoreValue) >= 10;
                        }

                        const scoreBadge = `<span class="inline-flex py-1 px-2.5 rounded-lg text-xs font-bold ${isGoodScore ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">${escapeHTML(scoreValue)}</span>`;
                        
                        const violationFlag = sub.fullscreenViolated === true || String(sub.fullscreenViolated).toLowerCase() === 'true';
                        const violationBadge = violationFlag 
                            ? `<span class="inline-flex items-center gap-1.5 py-1 px-2.5 rounded-lg text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/30"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Yes (Violated)</span>`
                            : `<span class="inline-flex items-center gap-1.5 py-1 px-2.5 rounded-lg text-xs font-bold bg-slate-500/20 text-slate-400 border border-slate-500/30"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> No</span>`;

                        return `
                            <tr class="${violationFlag ? 'bg-red-900/10' : 'hover:bg-slate-800/50'} transition-colors">
                                <td class="px-6 py-4 font-medium text-slate-200">${escapeHTML(sub.studentName || 'Unknown')}</td>
                                <td class="px-6 py-4 text-slate-400">${escapeHTML(sub.email || 'N/A')}</td>
                                <td class="px-6 py-4">${scoreBadge}</td>
                                <td class="px-6 py-4 font-mono text-indigo-300 text-sm">${escapeHTML(sub.timeTaken || 'N/A')}</td>
                                <td class="px-6 py-4">${violationBadge}</td>
                                <td class="px-6 py-4 text-right text-xs text-slate-500">${escapeHTML(dateStr)}</td>
                            </tr>
                        `;
                    }).join('');

                }, (error) => {
                    console.error("Error reading submissions:", error);
                    showToast("Failed to load submissions from database.", true);
                });

            } catch (err) {
                console.error("Initialization Error:", err);
                showToast("Authentication or Setup Failed.", true);
            }
        }

        window.generateNewCode = async () => {
            if (!auth.currentUser) {
                showToast("Waiting for authentication...", true);
                return;
            }

            try {
                // Generate 8-digit alphanumeric code
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let newCode = '';
                for (let i = 0; i < 8; i++) {
                    newCode += chars.charAt(Math.floor(Math.random() * chars.length));
                }

                // Save to Realtime Database node 'accessCode'
                const codeRef = ref(db, 'accessCode');
                await set(codeRef, {
                    code: newCode,
                    generatedAt: Date.now()
                });

                showToast("New access code generated and saved successfully!");
            } catch (error) {
                console.error("Error generating code:", error);
                showToast("Failed to save new code to database.", true);
            }
        };

        // Boot up the dashboard
        initDashboard();
    </script>
</body>
</html>
