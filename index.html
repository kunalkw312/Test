<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optenix Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <img src="https://res.cloudinary.com/dowhvdkjh/image/upload/v1782474012/OptenixWhite-rPCfLtKB_gehbfb.png" alt="Optenix Logo" class="h-8">
        <div class="text-slate-300 font-medium">Admin Dashboard | Live Submissions</div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow p-6 max-w-7xl mx-auto w-full">
        
        <!-- Live Submissions Table -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-xl overflow-hidden">
            <div class="p-6 border-b border-slate-700 flex flex-col md:flex-row justify-between items-center gap-4">
                <h2 class="text-xl font-bold text-white flex items-center">
                    <span class="w-3 h-3 bg-red-500 rounded-full mr-3 animate-pulse"></span>
                    Live Submissions
                </h2>
                
                <!-- NEW SEARCH BAR -->
                <div class="w-full md:w-1/3 relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="text" id="searchInput" onkeyup="filterSubmissions()" class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-10 pr-4 py-2 text-white focus:outline-none focus:border-blue-500 transition" placeholder="Search by student name...">
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="submissionsTable">
                    <thead>
                        <tr class="bg-slate-900 text-slate-400 text-sm uppercase tracking-wider">
                            <th class="p-4 border-b border-slate-700 font-medium">Student Name</th>
                            <th class="p-4 border-b border-slate-700 font-medium">Time Taken</th>
                            <th class="p-4 border-b border-slate-700 font-medium">Status / Reason</th>
                            <th class="p-4 border-b border-slate-700 font-medium">Submitted At</th>
                            <th class="p-4 border-b border-slate-700 font-medium text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="submissionsTableBody" class="divide-y divide-slate-700/50 text-sm">
                        <tr>
                            <td colspan="5" class="p-8 text-center text-slate-500 italic">Waiting for submissions...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modal for viewing full submission -->
        <div id="viewModal" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4">
            <div class="bg-slate-800 border border-slate-600 rounded-xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl">
                <div class="p-6 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="text-xl font-bold text-white" id="modalStudentName">Student Answers</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div class="p-6 overflow-y-auto flex-grow" id="modalContent">
                    <!-- Dynamic content injected here -->
                </div>
            </div>
        </div>

    </main>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACgdPSGH7jgcW2DvNofv6C_7wGWQGcNrg",
            authDomain: "test-4ea0e.firebaseapp.com",
            databaseURL: "https://test-4ea0e-default-rtdb.firebaseio.com",
            projectId: "test-4ea0e",
            storageBucket: "test-4ea0e.firebasestorage.app",
            messagingSenderId: "640924162744",
            appId: "1:640924162744:web:a4404af2ab63ac203bb24d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        let allSubmissionsData = {};

        signInAnonymously(auth).then(() => {
            listenForSubmissions();
        }).catch((error) => {
            console.error("Firebase Auth Error:", error);
        });

        function listenForSubmissions() {
            const submissionsRef = ref(db, 'submissions');
            onValue(submissionsRef, (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('submissionsTableBody');
                
                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500 italic">No submissions yet.</td></tr>';
                    return;
                }

                allSubmissionsData = data;
                tbody.innerHTML = '';
                
                // Convert to array and sort by newest first
                const submissionsArray = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                submissionsArray.forEach(sub => {
                    const date = new Date(sub.timestamp);
                    const timeString = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    let statusBadge = `<span class="bg-green-500/10 text-green-400 px-3 py-1 rounded-full text-xs font-medium border border-green-500/20">${sub.terminationReason}</span>`;
                    if (sub.terminationReason !== 'Manual Submission') {
                        statusBadge = `<span class="bg-red-500/10 text-red-400 px-3 py-1 rounded-full text-xs font-medium border border-red-500/20">${sub.terminationReason}</span>`;
                    }

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-800/50 transition student-row";
                    tr.innerHTML = `
                        <td class="p-4 font-medium text-slate-200 student-name">${sub.name}</td>
                        <td class="p-4 text-slate-400">${sub.timeTaken || 'Unknown'}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-slate-400 text-xs">${timeString}</td>
                        <td class="p-4 text-right">
                            <button onclick="viewSubmission('${sub.id}')" class="text-blue-400 hover:text-blue-300 font-medium text-sm transition">View Details</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                
                // Re-apply search filter in case a new submission arrives while searching
                window.filterSubmissions();
            });
        }

        // Global functions for inline HTML event handlers
        window.viewSubmission = function(id) {
            const data = allSubmissionsData[id];
            if(!data) return;

            document.getElementById('modalStudentName').innerText = `${data.name}'s Assessment`;
            const contentDiv = document.getElementById('modalContent');
            contentDiv.innerHTML = '';

            data.questions.forEach((q, index) => {
                const answer = data.answers && data.answers[index] ? data.answers[index] : 'No answer provided';
                
                const qBlock = document.createElement('div');
                qBlock.className = "mb-6 bg-slate-900 rounded p-4 border border-slate-700";
                
                let answerHtml = `<div class="mt-2 text-blue-300 font-medium">Answer: <span class="text-white">${answer}</span></div>`;
                if(q.type === 'code') {
                    answerHtml = `<div class="mt-2 text-slate-400 text-sm mb-1">Provided Code:</div>
                                  <pre class="bg-black p-3 rounded text-green-400 text-sm overflow-x-auto border border-slate-800"><code>${answer.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>`;
                }

                qBlock.innerHTML = `
                    <div class="text-sm text-slate-400 mb-1">Question ${index + 1} (${q.type.toUpperCase()})</div>
                    <div class="text-white mb-2">${q.q}</div>
                    ${answerHtml}
                `;
                contentDiv.appendChild(qBlock);
            });

            document.getElementById('viewModal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('viewModal').classList.add('hidden');
        }

        // SEARCH FILTER FUNCTION
        window.filterSubmissions = function() {
            const input = document.getElementById('searchInput').value.toUpperCase();
            const rows = document.querySelectorAll('.student-row');
            
            rows.forEach(row => {
                const nameCell = row.querySelector('.student-name');
                if (nameCell) {
                    const txtValue = nameCell.textContent || nameCell.innerText;
                    if (txtValue.toUpperCase().indexOf(input) > -1) {
                        row.style.display = "";
                    } else {
                        row.style.display = "none";
                    }
                }
            });
        }
    </script>
</body>
</html>
